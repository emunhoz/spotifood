name: Lints

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:tokens && git diff --exit-code -- packages/tokens/src/generated
      - run: bun run lint
      - run: bun run lint:css
