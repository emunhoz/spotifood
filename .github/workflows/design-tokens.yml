name: Design tokens

# Tokens Studio pushes tokens.json to design/tokens. Regenerate the TS/CSS output,
# refresh snapshots (styled-components class hashes change with every style), test,
# and open a PR so every Figma change is reviewed with a Vercel preview.
on:
  push:
    branches: [design/tokens]
    paths: [packages/tokens/tokens.json]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:tokens
      # -u rewrites snapshots but still fails on real assertion errors
      - run: bun run test:update
      - name: Commit generated tokens and snapshots
        id: commit
        run: |
          git add -A packages apps
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(tokens): regenerate from figma"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A merge from main into design/tokens also touches tokens.json but has nothing to
      # propose, so gating on the commit keeps that run green instead of failing to open an empty PR.
      - name: Open or update the sync PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list --head design/tokens --state open --json number -q '.[].number' | grep -q .; then
            exit 0
          fi
          gh pr create --base main --head design/tokens \
            --title "chore(tokens): sync from Figma" \
            --body "Token changes pushed from Tokens Studio. Generated TS/CSS and snapshots were rebuilt and tests passed; check the Vercel preview."
