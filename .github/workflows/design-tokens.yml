name: Design tokens

# Tokens Studio pushes tokens.json to design/tokens. Regenerate the TS/CSS output,
# test it, and open a PR so every Figma change is reviewed with a Vercel preview.
on:
  push:
    branches: [design/tokens]
    paths: [packages/tokens/tokens.json]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:tokens
      - run: bun run test:ci
      - name: Commit generated tokens
        run: |
          git diff --quiet -- packages/tokens/src/generated && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(tokens): regenerate from figma"
          git push
      - name: Open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view design/tokens --json state -q .state | grep -q OPEN && exit 0
          gh pr create --base main --head design/tokens \
            --title "chore(tokens): sync from Figma" \
            --body "Token changes pushed from Tokens Studio. Generated TS/CSS was rebuilt and tests passed; check the Vercel preview."
